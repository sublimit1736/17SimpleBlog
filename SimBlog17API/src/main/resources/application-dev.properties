# Dev profile overrides
# Keep Docker Compose integration enabled; compose services are excluded from auto service-connections via compose labels
spring.docker.compose.enabled=true
# JWT (dev fallback; DO NOT use in production)
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-32-chars-min}
# CORS (dev frontend origins)
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
# JPA (dev-friendly)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
