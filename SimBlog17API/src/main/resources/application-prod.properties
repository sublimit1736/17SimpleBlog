# Prod profile overrides
# JWT (prod must be explicitly configured)
app.jwt.secret=${JWT_SECRET}
# Security administrator (prod only, no fallback, no legacy plaintext compatibility)
# APP_ADMIN_USERNAME and APP_ADMIN_PASSWORD must be set before startup.
# Missing/blank value will fail startup in SecurityConfig userDetailsService.
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
# CORS (prod: explicit frontend origin whitelist)
app.cors.allowed-origin-patterns=https://your-frontend.example.com
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,X-Refresh-Token,X-Trace-Id
app.cors.exposed-headers=Authorization,Content-Disposition,X-Trace-Id
app.cors.allow-credentials=true
app.cors.max-age=600
# JPA (prod-safe)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
