# env
spring.config.import=optional:file:.env[.properties]
# Metadata
spring.application.name=S1mp7leBlogAPI
server.port=${SERVER_PORT:8080}
# Project
spring.devtools.remote.restart.enabled=false
# JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:blogdb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:your_password}
spring.data.redis.database=0
spring.data.redis.timeout=60000
# HikariCP
spring.datasource.hikari.pool-name=PostgreSQLPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.auto-commit=true
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:simblog17api}
app.jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}
app.security.auth.rate-limit-window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.auth.login.max-attempts-per-window=${AUTH_LOGIN_MAX_ATTEMPTS:10}
app.security.auth.refresh.max-attempts-per-window=${AUTH_REFRESH_MAX_ATTEMPTS:20}
app.media.storage-path=${MEDIA_STORAGE_PATH:uploads}
app.media.max-size-bytes=${MEDIA_MAX_SIZE_BYTES:5242880}
app.media.cleanup-enabled=${MEDIA_CLEANUP_ENABLED:true}
app.media.cleanup-older-than-days=${MEDIA_CLEANUP_OLDER_THAN_DAYS:7}
app.media.cleanup-cron=${MEDIA_CLEANUP_CRON:0 30 3 * * *}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId}] %logger{36} - %msg%n
# SpringDoc
springdoc.api-docs.path=/api/v3/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
# Use SPRING_PROFILES_ACTIVE to switch env (dev/prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}