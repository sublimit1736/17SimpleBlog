# Test profile uses Testcontainers-provided connection info via @ServiceConnection.
spring.application.name=SimBlog17API-Test
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Keep logs concise in CI/local test runs.
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
app.jwt.secret=test-secret-key-must-be-at-least-32-bytes
app.jwt.issuer=simblog17api-test
app.jwt.clock-skew-seconds=30

